# Baut macOS-App und Windows-EXE auf einem GitHub-Mac und veröffentlicht sie als Release.
# Vorher: Version in package.json erhöhen, committen, pushen.
# Start: GitHub → Actions → „Release bauen und veröffentlichen“ → Run workflow (Tag = v + Version).
#
# Signatur & Notarisierung der macOS-App (optional, siehe README „Programme signieren“):
#   Secrets MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER
# Ohne diese Secrets wird die App wie bisher nur ad-hoc signiert.
name: Release bauen und veröffentlichen

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, muss zur Version in package.json passen (z. B. v0.5.0)
        required: true
      notes:
        description: Kurze Beschreibung der Änderungen
        required: false
        default: Siehe README.

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag passt zur Version in package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then echo "::error::Tag $TAG passt nicht zu package.json ($VERSION)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: macOS-App bauen (signiert und notarisiert, falls Zertifikat hinterlegt)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "Developer-ID-Zertifikat gefunden – App wird signiert."
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
              echo "MAC_NOTARIZED=1" >> "$GITHUB_ENV"
            else
              echo "::warning::App Store Connect API-Schlüssel fehlt – App wird signiert, aber nicht notarisiert."
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
            echo "MAC_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Developer-ID-Zertifikat hinterlegt – macOS-App wird nur ad-hoc signiert."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          npx electron-builder --mac --publish never
          rm -f "$RUNNER_TEMP/apple_api_key.p8"

      - name: Windows-EXE bauen
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Ergebnisse prüfen
        run: |
          APP=dist/mac-universal/Echobefund.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Echobefund"
          if [ "${MAC_SIGNED:-}" = "1" ]; then
            codesign -dv "$APP" 2>&1 | grep -E "Authority=Developer ID Application"
          fi
          if [ "${MAC_NOTARIZED:-}" = "1" ]; then
            xcrun stapler validate "$APP"
            spctl --assess --type execute -vv "$APP"
          fi
          file dist/Echobefund-windows-portable.exe | grep -q "PE32"
          cd dist && shasum -a 256 Echobefund-mac-universal.zip Echobefund-windows-portable.exe | tee SHA256SUMS.txt

      - name: Release anlegen (falls noch nicht vorhanden)
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Echobefund ${TAG#v}" --notes "$NOTES" --draft
          fi

      - name: Dateien hochladen und veröffentlichen
        run: |
          cd dist
          gh release upload "$TAG" \
            "Echobefund-mac-universal.zip#macOS (Intel & Apple Silicon)" \
            "Echobefund-windows-portable.exe#Windows (64 Bit, portabel)" \
            "SHA256SUMS.txt#SHA-256-Prüfsummen" --clobber
          gh release edit "$TAG" --draft=false --latest
